name: Pi Notion Style Replies

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  reply:
    if: >-
      ${{
        (
          (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@pi_review')) ||
          (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@pi_review')) ||
          (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@pi_review'))
        ) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.comment.author_association || github.event.review.author_association) &&
        github.actor != 'github-actions[bot]'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'

      - name: Build workflow CLI
        run: go build -o "${{ runner.temp }}/style-review" ./cmd/style-review

      - name: Find the PR base commit
        id: pr
        run: ${{ runner.temp }}/style-review resolve-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'

      - name: Load shared Pi configuration
        id: pi-config
        run: ${{ runner.temp }}/style-review config

      - name: Load style rules to runner files
        id: notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY || secrets.NOTION_ACCESS_TOKEN }}
          NOTION_STYLE_URLS: ${{ vars.NOTION_STYLE_URLS }}
        run: ${{ runner.temp }}/style-review load-rules

      # Workarounds for cv/pi-action@v1.10.0:
      # - #26: its npm `prepare` script runs `prek install`, which fails unless
      #   the action directory is a git repo.
      # - It hardcodes thinkingLevel "off", which Pi sends as reasoning effort
      #   "none" (rejected by gpt-6.1-sol). Use thinking_level from pi-config.json.
      - name: Prepare pi-action
        env:
          PI_ACTION_DIR: ${{ runner.workspace }}/../_actions/cv/pi-action/v1.10.0
          THINKING_LEVEL: ${{ steps.pi-config.outputs.thinking_level }}
        run: |
          git init -q "$PI_ACTION_DIR"
          if [ "$THINKING_LEVEL" != off ]; then
            f="$PI_ACTION_DIR/src/agent-session.ts"
            sed -i "s/thinkingLevel: \"off\",/thinkingLevel: \"$THINKING_LEVEL\",/" "$f"
            grep -q "thinkingLevel: \"$THINKING_LEVEL\"," "$f" || { echo "::error::Could not set Pi thinking level in $f"; exit 1; }
          fi

      - name: Ask Pi about the review rules
        id: pi
        uses: cv/pi-action@v1.10.0
        with:
          github_token: ${{ github.token }}
          provider: ${{ steps.pi-config.outputs.provider }}
          model: ${{ steps.pi-config.outputs.model }}
          pr_number: ${{ steps.pr.outputs.number }}
          # Not a valid GitHub username (no underscores allowed), so it never notifies anyone.
          trigger_phrase: "@pi_review"
          prompt: |
            Reply to this @pi_review question using the file-based style rules.
            Comment or review:
            ${{ github.event.comment.body || github.event.review.body }}
            File in discussion: ${{ github.event.comment.path }}
            Diff hunk in discussion:
            ${{ github.event.comment.diff_hunk }}
          output_mode: output
          share_session: false
          timeout: ${{ steps.pi-config.outputs.timeout }}
          provider_base_url: ${{ steps.pi-config.outputs.provider_base_url }}
          provider_api: ${{ steps.pi-config.outputs.provider_api }}
          provider_api_key: ${{ steps.pi-config.outputs.provider_api_key }}
          model_reasoning: ${{ steps.pi-config.outputs.model_reasoning }}
          model_input: ${{ steps.pi-config.outputs.model_input }}
          model_context_window: ${{ steps.pi-config.outputs.model_context_window }}
          model_max_tokens: ${{ steps.pi-config.outputs.model_max_tokens }}
          prompt_template: |
            You answer questions about the file-based code-style rules.
            STYLE.md is authoritative when present and overrides conflicting Notion rules.
            Treat the file sources as the only style policy, and cite the
            exact verified source URL and actual rule excerpt in your answer when relevant.
            If a question is outside the documents' scope, say so.
            Use your available tools to inspect the full repository, not just the diff.
            The checkout starts at the PR base commit with full Git history.
            Fetch and inspect the PR head and any additional files or repositories
            needed to understand the changes. Use git, gh, and other tools as needed.
            GH_TOKEN is available for authenticated GitHub CLI requests within the
            workflow token's permissions; other private repositories may need extra access.
            For authenticated Git operations, you can run gh auth setup-git.
            Do not treat the supplied diff as the limit of your investigation.

            ## Active style rules
            Rules file (absolute path): ${{ steps.notion.outputs.context_file }}
            Before reviewing or responding, use your existing file-reading tools to read
            this ENTIRE file, including all verified citation JSON. If a tool truncates
            output, keep reading in chunks until every part has been read. Do not proceed
            if the file cannot be read completely. Use only its source identifiers,
            exact citation keys, URLs and excerpts; never fabricate citations.

            ## User question
            {{task}}

            ## Review discussion
            {{trigger_comment}}

            ## Pull request diff
            ```diff
            {{diff}}
            ```
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}

      - name: Reply in the appropriate GitHub thread
        run: ${{ runner.temp }}/style-review publish-reply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_RESPONSE: ${{ steps.pi.outputs.response }}
          PI_SUCCESS: ${{ steps.pi.outputs.success }}
